  <style>
    .status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-right:6px}.canon{background:#dff3df}.prov{background:#fff0b8}.open{background:#e7e5e4}.discard{background:#ffd9d9}.doc-section h2{margin-bottom:8px}.doc-section h3{margin:26px 0 8px;scroll-margin-top:140px}.doc-section p,.doc-section li{max-width:900px}.compact-table td:first-child{white-space:nowrap;font-weight:700}.compact-table td,.compact-table th{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.compact-table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f1eee6}.compact-table tr:last-child td{border-bottom:0}.source-note{color:var(--muted);font-size:.9rem}.code-line{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:inline-block}
    .gram-tabs{position:sticky;top:64px;z-index:9;background:rgba(246,244,239,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:8px;scrollbar-width:thin}
    .gram-tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
    .gram-tabs button:hover{color:var(--ink)}.gram-tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
    .gram-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
    .gram-toc{position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto;font-size:.88rem;padding-top:36px}
    .gram-toc p{margin:0 0 8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--accent)}
    .gram-toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
    .gram-toc a{display:block;padding:5px 0 5px 12px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.3}
    .gram-toc a:hover{color:var(--ink)}.gram-toc a.current{color:var(--ink);border-left-color:var(--accent);font-weight:700}
    .gram-toc .toc-group{margin-top:10px;font-weight:800;color:var(--ink)}
    .js .tab-panel[hidden]{display:none}
    #lista-abiertos li{margin:8px 0}#lista-abiertos a{font-weight:700}
    @media(max-width:900px){.gram-layout{grid-template-columns:minmax(0,1fr);gap:0}.gram-toc{position:static;max-height:none;padding-top:8px;border-bottom:1px solid var(--line);padding-bottom:12px}.gram-tabs{top:0;position:relative}}
